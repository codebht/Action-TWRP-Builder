name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "Manifest repository URL"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"

      MANIFEST_BRANCH:
        description: "Manifest branch"
        required: true
        default: "twrp-10"

      DEVICE_TREE_URL:
        description: "Device tree repository URL"
        required: true

      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "android-10"

      DEVICE_PATH:
        description: "Device tree path"
        required: true
        default: "device/acer/T482L"

      COMMON_TREE_URL:
        description: "Common tree repository URL"
        required: false
        default: ""

      COMMON_PATH:
        description: "Common tree path"
        required: false
        default: ""

      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "T482L"

      MAKEFILE_NAME:
        description: "Lunch makefile"
        required: true
        default: "omni_T482L"

      BUILD_TARGET:
        description: "Build target"
        required: true
        default: "recoveryimage"

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout Builder
        uses: actions/checkout@v4

      # --------------------------------------------------
      # CLEAN RUNNER
      # --------------------------------------------------

      - name: Clean Runner
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo apt-get clean

      # --------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libtinfo5 \
            libxml2-utils \
            lzop \
            openjdk-8-jdk \
            pngcrush \
            python3 \
            python3-pip \
            python-is-python3 \
            rsync \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      # --------------------------------------------------
      # JAVA
      # --------------------------------------------------

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      # --------------------------------------------------
      # WORKSPACE
      # --------------------------------------------------

      - name: Create Workspace
        id: pwd
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"

          echo "workspace-folder=$GITHUB_WORKSPACE/workspace" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # INSTALL REPO
      # --------------------------------------------------

      - name: Install Repo Tool
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          repo --version

      # --------------------------------------------------
      # INITIALIZE TWRP SOURCE
      # --------------------------------------------------

      - name: Repo Init
        run: |
          repo init \
            -u "${{ github.event.inputs.MANIFEST_URL }}" \
            -b "${{ github.event.inputs.MANIFEST_BRANCH }}" \
            --depth=1
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # SYNC SOURCE
      # --------------------------------------------------

      - name: Repo Sync
        run: |
          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc --all)"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # DEVICE TREE
      # --------------------------------------------------

      - name: Clone Device Tree
        run: |
          mkdir -p "${{ github.event.inputs.DEVICE_PATH }}"

          git clone \
            --depth=1 \
            --branch "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "${{ github.event.inputs.DEVICE_TREE_URL }}" \
            "${{ github.event.inputs.DEVICE_PATH }}"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # COMMON TREE
      # --------------------------------------------------

      - name: Clone Common Tree
        if: ${{ github.event.inputs.COMMON_TREE_URL != '' && github.event.inputs.COMMON_PATH != '' }}
        run: |
          mkdir -p "${{ github.event.inputs.COMMON_PATH }}"

          git clone \
            --depth=1 \
            "${{ github.event.inputs.COMMON_TREE_URL }}" \
            "${{ github.event.inputs.COMMON_PATH }}"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # CHECK DEVICE TREE
      # --------------------------------------------------

      - name: Check Device Tree
        run: |
          set -e

          DEVICE="${{ github.event.inputs.DEVICE_PATH }}"

          echo "======================================"
          echo "Checking device tree"
          echo "======================================"

          test -f "$DEVICE/AndroidProducts.mk"
          test -f "$DEVICE/BoardConfig.mk"

          echo "Device tree found:"
          echo "$DEVICE"

          echo
          echo "AndroidProducts.mk:"
          cat "$DEVICE/AndroidProducts.mk"

          echo
          echo "BoardConfig.mk:"
          head -n 80 "$DEVICE/BoardConfig.mk"

      # --------------------------------------------------
      # CHECK OMNI CONFIG
      # --------------------------------------------------

      - name: Check Omni Config
        run: |
          set -e

          if [ ! -f "vendor/omni/config/common.mk" ]; then
            echo "ERROR: vendor/omni/config/common.mk not found!"
            exit 1
          fi

          echo "vendor/omni/config/common.mk found."

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # FIX LEGACY PYTHON SCRIPT
      # --------------------------------------------------

      - name: Fix Legacy Python Script
        shell: bash
        run: |
          set -e

          SCRIPT="build/make/tools/check_radio_versions.py"

          echo "======================================"
          echo "Checking legacy Python script"
          echo "======================================"

          if [ ! -f "$SCRIPT" ]; then
            echo "ERROR: $SCRIPT not found!"
            exit 1
          fi

          echo "Found: $SCRIPT"

          # Make a backup first.
          cp "$SCRIPT" "$SCRIPT.orig"

          # Convert Python 2 print statements to Python 3
          # while PRESERVING the original indentation.
          sed -i -E \
            's/^([[:space:]]*)print[[:space:]]+(.+)$/\1print(\2)/' \
            "$SCRIPT"

          echo
          echo "Checking Python syntax..."

          python3 -m py_compile "$SCRIPT"

          echo
          echo "Python script syntax is valid."

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # CHECK LUNCH TARGET
      # --------------------------------------------------

      - name: Check Lunch Target
        run: |
          set -e

          TARGET="omni_${{ github.event.inputs.DEVICE_NAME }}-eng"

          echo "Expected lunch target:"
          echo "$TARGET"

          if [ ! -f "device/${{ github.event.inputs.DEVICE_NAME }}/AndroidProducts.mk" ]; then
            echo "ERROR: AndroidProducts.mk missing!"
            exit 1
          fi

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # CREATE SWAP
      # --------------------------------------------------

      - name: Create Swap
        run: |
          set -e

          echo "Creating 12 GB swap..."

          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h

      # --------------------------------------------------
      # SETUP BUILD ENVIRONMENT
      # --------------------------------------------------

      - name: Setup Build Environment
        run: |
          set -e

          source build/envsetup.sh

          lunch "omni_${{ github.event.inputs.DEVICE_NAME }}-eng"

          echo
          echo "======================================"
          echo "Lunch successful"
          echo "======================================"

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # SHOW BUILD CONFIG
      # --------------------------------------------------

      - name: Show Build Configuration
        run: |
          echo "======================================"
          echo "BUILD CONFIGURATION"
          echo "======================================"

          echo "Device: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Target: ${{ github.event.inputs.BUILD_TARGET }}"
          echo "Manifest: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"

          echo
          echo "CPU:"
          nproc --all

          echo
          echo "RAM:"
          free -h

          echo
          echo "Disk:"
          df -h .

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # CLEAN OLD BUILD
      # --------------------------------------------------

      - name: Clean Build
        run: |
          set -e

          source build/envsetup.sh
          lunch "omni_${{ github.event.inputs.DEVICE_NAME }}-eng"

          make clean

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # BUILD RECOVERY
      # --------------------------------------------------

      - name: Build Recovery
        run: |
          set -e

          source build/envsetup.sh

          lunch "omni_${{ github.event.inputs.DEVICE_NAME }}-eng"

          echo
          echo "======================================"
          echo "STARTING TWRP BUILD"
          echo "======================================"

          mka "${{ github.event.inputs.BUILD_TARGET }}" \
            -j"$(nproc --all)"

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # SHOW OUTPUT
      # --------------------------------------------------

      - name: Show Build Output
        if: always()
        run: |
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          find "out/target/product/${{ github.event.inputs.DEVICE_NAME }}" \
            -maxdepth 2 \
            -type f \
            \( \
              -name "recovery.img" \
              -o -name "*.zip" \
              -o -name "boot.img" \
            \) \
            -print

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      # --------------------------------------------------
      # UPLOAD ARTIFACTS
      # --------------------------------------------------

      - name: Upload Recovery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-${{ github.event.inputs.DEVICE_NAME }}
          path: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          if-no-files-found: warn

      # --------------------------------------------------
      # CREATE GITHUB RELEASE
      # --------------------------------------------------

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "TWRP ${{ github.event.inputs.DEVICE_NAME }} Build ${{ github.run_number }}"
          generate_release_notes: true
          files: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip

      # --------------------------------------------------
      # DEBUG ON FAILURE
      # --------------------------------------------------

      - name: Debug Failure
        if: failure()
        run: |
          echo "======================================"
          echo "BUILD FAILED"
          echo "======================================"

          echo
          echo "Last build errors:"
          find out -type f \
            \( -name "*.log" -o -name "*.txt" \) \
            -print 2>/dev/null | head -50 || true

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}